<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loyalty Admin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    /* Boot skeleton, shown from first paint until Angular replaces <app-root>'s content —
       inlined so it renders before the app's own stylesheet has loaded. */
    @keyframes boot-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .boot-shell { display: flex; height: 100vh; background: #eef1f6; font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif; }
    .boot-sidebar { width: 15rem; flex-shrink: 0; background: #ffffff; border-right: 1px solid #e5e7eb; padding: 1rem 0.75rem; box-sizing: border-box; }
    .boot-logo { width: 2rem; height: 2rem; border-radius: 0.5rem; background: #125cfa; margin-bottom: 1.5rem; }
    .boot-navitem { height: 2rem; border-radius: 0.5rem; background: #eef1f6; margin-bottom: 0.5rem; animation: boot-pulse 1.6s ease-in-out infinite; }
    .boot-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .boot-topbar { height: 3.5rem; flex-shrink: 0; background: #ffffff; border-bottom: 1px solid #e5e7eb; }
    .boot-content { flex: 1; padding: 1.5rem 2rem; }
    .boot-block { border-radius: 0.75rem; background: #ffffff; border: 1px solid #e5e7eb; animation: boot-pulse 1.6s ease-in-out infinite; }
  </style>
</head>
<body>
  <app-root>
    <div class="boot-shell" aria-hidden="true">
      <div class="boot-sidebar">
        <div class="boot-logo"></div>
        <div class="boot-navitem" style="width: 80%;"></div>
        <div class="boot-navitem" style="width: 65%;"></div>
        <div class="boot-navitem" style="width: 70%;"></div>
      </div>
      <div class="boot-main">
        <div class="boot-topbar"></div>
        <div class="boot-content">
          <div class="boot-block" style="height: 4.5rem; margin-bottom: 1.25rem;"></div>
          <div class="boot-block" style="height: 16rem;"></div>
        </div>
      </div>
    </div>
  </app-root>
</body>
</html>
